<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>JPC Pembukuan</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f3f6f7;color:#172027}button,input,textarea,select{font:inherit}.gate{position:fixed;inset:0;background:#0f766e;display:grid;place-items:center;padding:20px;z-index:20}.box,.card{background:white;border-radius:16px;padding:18px;box-shadow:0 8px 30px #0002}.box{width:min(420px,100%)}label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}textarea{min-height:200px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:#e2e8f0}.p{background:#0f766e;color:white}.d{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{font-size:13px;margin-top:10px;color:#475569}.err{color:#b91c1c}header{background:#0f766e;color:white;padding:13px 15px;display:flex;justify-content:space-between;align-items:center}header b{font-size:17px}nav{display:flex;gap:6px;overflow:auto;padding:8px;background:white;border-bottom:1px solid #ddd}nav button{white-space:nowrap;border:0;border-radius:9px;padding:9px 12px;font-weight:700}nav .on{background:#0f766e;color:white}main{max-width:1100px;margin:auto;padding:12px}.view{display:none}.view.on{display:block}.card{margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:650px){.kpis{grid-template-columns:repeat(2,1fr)}}.k{background:white;border:1px solid #ddd;border-radius:12px;padding:10px}.k small{color:#64748b}.k b{display:block}.tw{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px;border-bottom:1px solid #e5e7eb;text-align:left}.num{text-align:right;white-space:nowrap}#paper{background:white;padding:8mm;max-width:210mm;margin:auto}.title{text-align:center;border-bottom:2px solid #111;margin-bottom:8px}.sec{font-weight:800;background:#eee;padding:5px;margin-top:8px}@media print{header,nav,.noprint,#gate{display:none!important}body{background:white}main{padding:0}.view{display:none!important}#v-report{display:block!important}#paper{padding:0;max-width:none}@page{size:A4 portrait;margin:7mm}}
</style></head><body>
<div id="gate" class="gate"><div class="box"><h2>JPC Pembukuan LPG 3 Kg</h2><p style="color:#64748b">Aplikasi internal — tidak ada pendaftaran akun.</p><label>Username</label><input id="user" autocomplete="username"><label>Password</label><input id="pass" type="password" autocomplete="current-password"><div class="row"><button id="login" class="btn p">Masuk</button></div><div id="loginMsg" class="msg"></div></div></div>
<header><div><b>JPC Pembukuan LPG 3 Kg</b><div style="font-size:11px;opacity:.85">Laporan harian & evaluasi armada</div></div><div><span id="who" style="font-size:11px"></span> <button id="logout" class="btn">Keluar</button></div></header>
<nav><button class="on" data-v="input">Input</button><button data-v="report">Laporan</button><button data-v="history">Riwayat</button><button data-v="eval">Evaluasi</button><button data-v="accounts">Akun</button></nav>
<main>
<section id="v-input" class="view on"><div class="card"><h3>Input laporan</h3><div class="grid"><div><label>Tanggal laporan</label><input id="date" type="date"></div><div><label>Data copy-paste Excel</label><textarea id="paste" placeholder="Paste kolom dari sheet TGL 1 di sini"></textarea></div></div><div class="row"><button id="parse" class="btn p">Proses Data</button><button id="sample" class="btn">Contoh</button><button id="clear" class="btn">Kosongkan</button></div><div id="parseMsg" class="msg"></div></div></section>
<section id="v-report" class="view"><div class="row noprint"><button id="save" class="btn p">Simpan Online</button><button id="print" class="btn">Cetak / PDF</button><button id="back" class="btn">Kembali</button></div><div id="kpis" class="kpis noprint"></div><div id="paper"></div></section>
<section id="v-history" class="view"><div class="card"><h3>Riwayat</h3><div id="history">Memuat...</div></div></section>
<section id="v-eval" class="view"><div class="card"><h3>Evaluasi sopir & armada</h3><label>Bulan</label><input id="month" type="month"><div id="evalBox" style="margin-top:12px"></div></div></section>
<section id="v-accounts" class="view"><div class="card"><h3>Kelola akun internal</h3><div id="adminForm"><div class="grid"><div><label>Username</label><input id="nu"><label>Nama</label><input id="nn"></div><div><label>Password</label><input id="np" type="password"><label>Hak akses</label><select id="nr"><option value="operator">Operator</option><option value="viewer">Viewer</option><option value="admin">Admin</option></select></div></div><div class="row"><button id="make" class="btn p">Buat Akun</button></div><div id="accountMsg" class="msg"></div></div><div id="accountList" style="margin-top:12px"></div></div></section>
</main>
<script>
const BASE='https://nzodjjrbsnqirzehyimd.supabase.co',KEY='sb_publishable_pWo_VGJoJ_ETaHYmjZQfgw_h8CWpnbc',AUTH=BASE+'/functions/v1/jpc-internal-auth',REST=BASE+'/rest/v1';
const $=x=>document.getElementById(x),rp=x=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(+x||0),nf=x=>new Intl.NumberFormat('id-ID').format(+x||0),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let S=JSON.parse(localStorage.getItem('jpc_s')||'null'),CUR=null;function today(){let d=new Date;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}$('date').value=today();$('month').value=today().slice(0,7);
function num(v){let s=String(v??'').trim().replace(/Rp/gi,'').replace(/\s/g,'');if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');else s=s.replace(/[^0-9.-]/g,'');return +s||0}
function busy(b,on,t='Memproses...'){if(on){b.dataset.o=b.textContent;b.textContent=t;b.disabled=true}else{b.textContent=b.dataset.o||b.textContent;b.disabled=false}}
async function edge(body,token=false){let h={'Content-Type':'application/json','apikey':KEY};if(token){if(!S?.access_token)throw Error('Sesi login berakhir');h.Authorization='Bearer '+S.access_token}let r=await fetch(AUTH,{method:'POST',headers:h,body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Permintaan gagal');return d}
async function rest(path,opt={}){let r=await fetch(REST+'/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+S.access_token,'Content-Type':'application/json',Prefer:opt.prefer||'return=representation'}});if(!r.ok)throw Error((await r.text())||('HTTP '+r.status));if(r.status===204)return[];let t=await r.text();return t?JSON.parse(t):[]}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$('v-'+v).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));if(v==='history')history();if(v==='eval')evaluation();if(v==='accounts')accounts()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
async function doLogin(){let b=$('login'),m=$('loginMsg'),u=$('user').value.trim(),p=$('pass').value;if(!u||!p){m.textContent='Isi username dan password.';return}busy(b,true,'Menghubungkan...');m.textContent='';try{let d=await edge({action:'login',username:u,password:p});S={access_token:d.access_token,refresh_token:d.refresh_token,user:d.user,profile:d.profile};localStorage.setItem('jpc_s',JSON.stringify(S));enter()}catch(e){m.className='msg err';m.textContent='Gagal masuk: '+e.message}finally{busy(b,false)}}$('login').onclick=doLogin;$('pass').onkeydown=e=>{if(e.key==='Enter')doLogin()};
function enter(){if(!S?.access_token)return;$('gate').style.display='none';$('who').textContent=S.profile?.full_name||'Online';if(S.profile?.role!=='admin')$('adminForm').style.display='none'}if(S?.access_token)enter();$('logout').onclick=()=>{localStorage.removeItem('jpc_s');S=null;location.reload()};
function parse(){let rows=$('paste').value.split(/\r?\n/).map(x=>x.split('\t')),routes=[],cur=null,driver='',truck='';for(let c of rows){if(!c.some(x=>String(x).trim()))continue;if(String(c[0]||'').toUpperCase().includes('TOTAL'))continue;let d=String(c[1]||'').trim(),t=String(c[2]||'').trim();if(d)driver=d;if(t)truck=t;if((d||t)&&(!cur||cur.driver!==driver||cur.truck!==truck)){cur={no:routes.length+1,driver:driver||'-',truck:truck||'-',sales:[],exp:[]};routes.push(cur)}if(!cur)continue;let cust=String(c[3]||'').trim(),qty=num(c[7]),rev=num(c[8]),en=String(c[9]||'').trim(),ea=num(c[10]);if(cust&&cust!=='0'&&qty>0)cur.sales.push({customer:cust,qty,revenue:rev||qty*16000});if(en&&en!=='0'&&ea>0)cur.exp.push({name:en,amount:ea})}routes=routes.filter(r=>r.sales.length||r.exp.length);if(!routes.length)throw Error('Data belum terbaca. Copy langsung dari Excel lalu paste di sini.');CUR={date:$('date').value||today(),raw:$('paste').value,routes};render()}
function rt(r){let q=r.sales.reduce((a,x)=>a+x.qty,0),v=r.sales.reduce((a,x)=>a+x.revenue,0),e=r.exp.reduce((a,x)=>a+x.amount,0);return{q,v,e}}function totals(){return CUR.routes.reduce((a,r)=>{let t=rt(r);a.q+=t.q;a.v+=t.v;a.e+=t.e;return a},{q:0,v:0,e:0})}
function render(){let T=totals();$('kpis').innerHTML=`<div class=k><small>Tabung</small><b>${nf(T.q)}</b></div><div class=k><small>Penerimaan</small><b>${rp(T.v)}</b></div><div class=k><small>Pengeluaran</small><b>${rp(T.e)}</b></div><div class=k><small>Arus kas bersih</small><b>${rp(T.v-T.e)}</b></div>`;let s='',e='';CUR.routes.forEach(r=>{s+=r.sales.map(x=>`<tr><td>${esc(r.driver)}</td><td>${esc(r.truck)}</td><td>${esc(x.customer)}</td><td class=num>${nf(x.qty)}</td><td class=num>${rp(x.revenue)}</td></tr>`).join('');e+=r.exp.map(x=>`<tr><td>${esc(r.driver)}</td><td>${esc(r.truck)}</td><td>${esc(x.name)}</td><td class=num>${rp(x.amount)}</td></tr>`).join('')});$('paper').innerHTML=`<div class=title><h2>PT. ADWA PUTRA JAWA</h2><b>LAPORAN PENERIMAAN DAN PENGELUARAN HARIAN</b><div>${CUR.date}</div></div><div class=sec>A. Rincian Penerimaan</div><table><tr><th>Sopir</th><th>Truk</th><th>Pelanggan</th><th>Tabung</th><th>Penerimaan</th></tr>${s}</table><div class=sec>B. Rincian Pengeluaran</div><table><tr><th>Sopir</th><th>Truk</th><th>Keterangan</th><th>Nominal</th></tr>${e}</table><p><b>Total penerimaan:</b> ${rp(T.v)}<br><b>Total pengeluaran:</b> ${rp(T.e)}<br><b>Arus kas bersih:</b> ${rp(T.v-T.e)}</p>`;show('report')}
$('parse').onclick=()=>{try{parse();$('parseMsg').textContent='Data berhasil dibaca.'}catch(e){$('parseMsg').className='msg err';$('parseMsg').textContent=e.message}};$('clear').onclick=()=>{$('paste').value=''};$('sample').onclick=()=>{$('date').value='2026-09-01';$('paste').value='1\tAGUS P\tAE 8361 NM\tWAHYU HARTONO\tTF\t01/09/2026\t1 September 2026\t100\t1600000\tONGKI\t56000\n\t\t\tDAMAYANTO\tTF\t01/09/2026\t1 September 2026\t50\t800000\tPLASTIK\t50000'};$('back').onclick=()=>show('input');$('print').onclick=()=>print();
async function save(){if(!CUR)return;let b=$('save');busy(b,true,'Menyimpan...');try{let T=totals(),uid=S.user.id,r=await rest('jpc_reports?on_conflict=created_by,report_date',{method:'POST',prefer:'resolution=merge-duplicates,return=representation',body:JSON.stringify([{created_by:uid,report_date:CUR.date,raw_paste:CUR.raw,status:'final',total_trips:CUR.routes.length,total_qty:T.q,total_revenue:T.v,total_expense:T.e}])}),rid=r[0].id;await rest('jpc_sales?report_id=eq.'+rid,{method:'DELETE',prefer:'return=minimal'});await rest('jpc_expenses?report_id=eq.'+rid,{method:'DELETE',prefer:'return=minimal'});await rest('jpc_trips?report_id=eq.'+rid,{method:'DELETE',prefer:'return=minimal'});let ts=[],ss=[],es=[];CUR.routes.forEach(r=>{let t=rt(r),id=crypto.randomUUID();ts.push({id,report_id:rid,trip_no:r.no,driver_name:r.driver,truck_no:r.truck,total_qty:t.q,total_revenue:t.v,total_expense:t.e});r.sales.forEach(x=>ss.push({report_id:rid,trip_id:id,customer_name:x.customer,qty:x.qty,unit_price:x.qty?x.revenue/x.qty:16000,revenue:x.revenue}));r.exp.forEach(x=>es.push({report_id:rid,trip_id:id,category:x.name,amount:x.amount}))});if(ts.length)await rest('jpc_trips',{method:'POST',body:JSON.stringify(ts)});if(ss.length)await rest('jpc_sales',{method:'POST',body:JSON.stringify(ss)});if(es.length)await rest('jpc_expenses',{method:'POST',body:JSON.stringify(es)});alert('Berhasil disimpan online.')}catch(e){alert('Gagal menyimpan: '+e.message)}finally{busy(b,false)}}$('save').onclick=save;
async function history(){let el=$('history');el.textContent='Memuat...';try{let a=await rest('jpc_reports?select=report_date,total_qty,total_revenue,total_expense&order=report_date.desc',{method:'GET'});el.innerHTML=a.length?'<div class=tw><table><tr><th>Tanggal</th><th>Tabung</th><th>Penerimaan</th><th>Pengeluaran</th></tr>'+a.map(x=>`<tr><td>${x.report_date}</td><td class=num>${nf(x.total_qty)}</td><td class=num>${rp(x.total_revenue)}</td><td class=num>${rp(x.total_expense)}</td></tr>`).join('')+'</table></div>':'Belum ada laporan.'}catch(e){el.textContent=e.message}}
async function evaluation(){let el=$('evalBox'),m=$('month').value;el.textContent='Memuat...';try{let d=new Date(m+'-01'),nxt=new Date(d.getFullYear(),d.getMonth()+1,1),end=nxt.toISOString().slice(0,10),reps=await rest(`jpc_reports?select=id&report_date=gte.${m}-01&report_date=lt.${end}`,{method:'GET'});if(!reps.length){el.textContent='Belum ada data.';return}let tr=await rest('jpc_trips?select=driver_name,truck_no,total_qty,total_expense&report_id=in.('+reps.map(x=>x.id).join(',')+')',{method:'GET'}),map={};tr.forEach(x=>{let k=x.driver_name+'|'+x.truck_no,o=map[k]||(map[k]={d:x.driver_name,t:x.truck_no,q:0,e:0});o.q+=+x.total_qty;o.e+=+x.total_expense});let a=Object.values(map).sort((a,b)=>b.e-a.e);el.innerHTML='<table><tr><th>Sopir</th><th>Truk</th><th>Tabung</th><th>Pengeluaran</th><th>Biaya/Tabung</th></tr>'+a.map(x=>`<tr><td>${esc(x.d)}</td><td>${esc(x.t)}</td><td class=num>${nf(x.q)}</td><td class=num>${rp(x.e)}</td><td class=num>${rp(x.q?x.e/x.q:0)}</td></tr>`).join('')+'</table>'}catch(e){el.textContent=e.message}}$('month').onchange=evaluation;
async function accounts(){let el=$('accountList');if(S.profile?.role!=='admin'){el.textContent='Hanya admin.';return}el.textContent='Memuat...';try{let d=await edge({action:'list_users'},true);el.innerHTML='<table><tr><th>Username</th><th>Nama</th><th>Role</th><th>Status</th></tr>'+d.users.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.full_name)}</td><td>${x.role}</td><td>${x.is_active?'Aktif':'Nonaktif'}</td></tr>`).join('')+'</table>'}catch(e){el.textContent=e.message}}
$('make').onclick=async()=>{let b=$('make');busy(b,true,'Membuat...');try{await edge({action:'create_user',username:$('nu').value,password:$('np').value,full_name:$('nn').value,role:$('nr').value},true);$('accountMsg').textContent='Akun berhasil dibuat.';accounts()}catch(e){$('accountMsg').textContent=e.message}finally{busy(b,false)}};
</script></body></html>
